<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - SocialMedia</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 40px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            padding: 10px 18px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        a {
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="box">

        <h1>👤 Edit Profile</h1>

        {% if profile.profile_picture %}
            <img
                src="{{ profile.profile_picture.url }}"
                alt="Profile Picture"
            >
        {% endif %}

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <label>
                Profile Picture
            </label>

            <input
                type="file"
                name="profile_picture"
                accept="image/*"
            >

            <label>
                Bio
            </label>

            <textarea
                name="bio"
                placeholder="Write something about yourself..."
            >{{ profile.bio }}</textarea>

            <button type="submit">
                💾 Save Profile
            </button>

        </form>

        <a href="{% url 'profile' request.user.username %}">
            ← Back to Profile
        </a>

    </div>

</div>

</body>
</html>
